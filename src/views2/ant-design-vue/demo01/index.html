<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>示例2</title>
  <!-- 导入 ICON -->
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <!-- 导入 AntDesignVue -->
  <link rel="stylesheet" href="/public/ant-design-vue/antd.reset.css">
  <link rel="stylesheet" href="/public/ant-design-vue/antd.min.css">
  <!-- 导入 Layui-->
  <link rel="stylesheet" href="/public/layui/css/layui.css">
  <!-- 导入 自定义CSS -->
  <link rel="stylesheet" href="index.css" />
  <!-- 其他头部信息 -->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    #app {
      display: flex;
      flex-direction: column;
    }

    .ant-layout {
      height: 100%;
      /* 确保布局充满容器 */
    }

    .ant-layout-content {
      padding: 15px;
      overflow-y: auto;
      /* 内容区域允许滚动 */
      background: #fff;
      /* 添加背景色以便区分 */
    }

    .search-form .ant-form-item {
      margin-right: 8px;
      /* 调整表单项间距 */
      margin-bottom: 10px;
      /* 调整表单项底部间距 */
    }

    .action-buttons .ant-btn {
      margin-right: 8px;
    }

    .ant-table-wrapper {
      margin-top: 15px;
      /* 表格上方间距 */
    }

    .ant-pagination {
      margin-top: 15px;
      /* 分页器上方间距 */
      text-align: right;
      /* 分页器右对齐 */
    }

    /* 可以移除或调整之前的 Element Plus 特定样式 */
    /* .el-table__row { user-select: none; } */
    /* .centered-text { ... } */
  </style>
</head>

<body>
  <div id="app">
    <a-spin :spinning="loading" tip="加载中...">
      <a-layout>
        <!-- <a-layout-header>...</a-layout-header> -->
        <a-layout-content>
          <!-- 搜索表单 -->
          <a-form layout="inline" :model="searchForm" ref="searchFormRef" class="search-form">
            <!-- vState 隐藏 -->
            <!-- <a-form-item label="检像票状态" name="vState" v-show="false">
              <a-input v-model:value="searchForm.vState" />
            </a-form-item> -->
            <a-form-item label="关键字" name="searchKey">
              <a-input v-model:value="searchForm.searchKey" placeholder="请输入关键字" allow-clear />
            </a-form-item>
            <a-form-item label="年月" name="vDay">
              <a-date-picker v-model:value="searchForm.vDay" picker="month" format="YYYY年MM月" value-format="YYYY-MM-01"
                placeholder="选择年月" @change="fun_search" />
            </a-form-item>
            <a-form-item class="action-buttons">
              <a-button type="primary" @click="fun_search">查询</a-button>
              <a-button type="primary" @click="fun_create"
                style="background-color: #52c41a; border-color: #52c41a;">新建</a-button>
              <a-button type="primary" danger @click="fun_delete">删除</a-button>
            </a-form-item>
          </a-form>

          <!-- 数据表格 -->
          <a-table :columns="tableColumns" :data-source="dataList" :row-key="record => record.obj_id"
            :pagination="false" :scroll="{ y: tableScrollY }"
            :row-selection="{ type: 'radio', selectedRowKeys: selectedRowKeys, onChange: onSelectChange }"
            @row="handleRowEvents" size="middle" bordered>
            <!-- 可以自定义列渲染 -->
            <template #bodyCell="{ column, text, record, index }">
              <template v-if="column.key === 'index'">
                {{ (pagination.current - 1) * pagination.pageSize + index + 1 }}
              </template>
              <template v-if="column.key === 'rq'">
                {{ formatDate(text) }} <!-- 使用 dayjs 进行格式化 -->
              </template>
            </template>
          </a-table>

          <!-- 分页器 -->
          <a-pagination v-model:current="pagination.current" v-model:pageSize="pagination.pageSize"
            :page-size-options="pagination.pageSizeOptions" :total="pagination.total" show-size-changer
            show-quick-jumper :show-total="total => `共 ${total} 条`" @change="handleTableChange" />

          <!-- 新建/编辑/详情 对话框 -->
          <a-modal v-model:open="dataFormVisible" :title="dataFormTitle" @ok="handleModalOk" @cancel="handleModalCancel"
            :confirm-loading="modalLoading" :mask-closable="false" width="500px"
            :footer="dataFormStatus === 'detail' ? null : undefined">
            <a-form ref="dataFormRef" :model="dataForm" :rules="dataFormRules" :label-col="{ span: 5 }"
              :wrapper-col="{ span: 18 }" :disabled="dataFormStatus === 'detail'">
              <a-form-item label="姓名" name="name">
                <a-input v-model:value="dataForm.name" placeholder="请输入姓名" allow-clear />
              </a-form-item>
              <a-form-item label="年月" name="vDay">
                <a-date-picker v-model:value="searchForm.vDay" picker="month" format="YYYY年MM月"
                  value-format="YYYY-MM-01" placeholder="选择年月" @change="fun_search" />
              </a-form-item>
              <a-form-item class="action-buttons">
                <a-button type="primary" @click="fun_search">查询</a-button>
                <a-button type="primary" @click="fun_create"
                  style="background-color: #52c41a; border-color: #52c41a;">新建</a-button>
                <a-button type="primary" danger @click="fun_delete">删除</a-button>
              </a-form-item>
            </a-form>

            <!-- 数据表格 -->
            <a-table :columns="tableColumns" :data-source="dataList" :row-key="record => record.obj_id"
              :pagination="false" :scroll="{ y: tableScrollY }"
              :row-selection="{ type: 'radio', selectedRowKeys: selectedRowKeys, onChange: onSelectChange }"
              @row="handleRowEvents" size="middle" bordered>
              <!-- 可以自定义列渲染 -->
              <template #bodyCell="{ column, text, record, index }">
                <template v-if="column.key === 'index'">
                  {{ (pagination.current - 1) * pagination.pageSize + index + 1 }}
                </template>
                <template v-if="column.key === 'rq'">
                  {{ formatDate(text) }}
                </template>
              </template>
            </a-table>

            <!-- 分页器 -->
            <a-pagination v-model:current="pagination.current" v-model:pageSize="pagination.pageSize"
              :page-size-options="pagination.pageSizeOptions" :total="pagination.total" show-size-changer
              show-quick-jumper :show-total="total => `共 ${total} 条`" @change="handleTableChange" />

            <!-- 新建/编辑/详情 对话框 -->
            <a-modal v-model:open="dataFormVisible" :title="dataFormTitle" @ok="handleModalOk"
              @cancel="handleModalCancel" :confirm-loading="modalLoading" :mask-closable="false" width="500px"
              :footer="dataFormStatus === 'detail' ? null : undefined">
              <a-form ref="dataFormRef" :model="dataForm" :rules="dataFormRules" :label-col="{ span: 5 }"
                :wrapper-col="{ span: 18 }" :disabled="dataFormStatus === 'detail'">
                <a-form-item label="姓名" name="name">
                  <a-input v-model:value="dataForm.name" placeholder="请输入姓名" allow-clear />
                </a-form-item>
                <a-form-item label="日期" name="rq">
                  <a-date-picker v-model:value="dataForm.rq" format="YYYY年MM月DD日" value-format="YYYY-MM-DD"
                    placeholder="选择日期" style="width: 100%;" />
                </a-form-item>
                <a-form-item label="地址" name="address">
                  <a-input v-model:value="dataForm.address" placeholder="请输入地址" allow-clear />
                </a-form-item>
              </a-form>
            </a-modal>

          </a-layout-content>
        </a-layout>
      </a-spin>
    </a-config-provider>
  </div>
</body>
<!-- 导入 Vue3 -->
<script src="/public/vue/vue.global.prod.js"></script>
<!-- 导入 Dayjs (Antd 推荐配合使用) -->
<script src="/public/dayjs/dayjs.min.js"></script>
<script src="/public/dayjs/locale/zh-cn.js"></script>
<script src="/public/dayjs/plugin/isBetween.js"></script>
<script src="/public/dayjs/plugin/isSameOrBefore.js"></script>
<script src="/public/dayjs/plugin/customParseFormat.js"></script>
<script src="/public/dayjs/plugin/advancedFormat.js"></script>
<script src="/public/dayjs/plugin/weekday.js"></script>
<script src="/public/dayjs/plugin/localeData.js"></script>
<script src="/public/dayjs/plugin/weekOfYear.js"></script>
<script src="/public/dayjs/plugin/weekYear.js"></script>
<script src="/public/dayjs/plugin/quarterOfYear.js"></script>
<!-- 导入 AntDesignVue，包含中文语言包，使用 a-config-provider :locale="antdAppLocale"-->
<script src="/public/ant-design-vue/antd-with-locales.min.js"></script>
<!-- 导入 Axios -->
<script src="/public/axios/axios.min.js"></script>
<!-- 导入 Echarts -->
<script src="/public/echarts/echarts.js"></script>
<!-- 导入 Jquery-->
<script src="/public/jquery/jquery.min.js"></script>
<!-- 导入 index.js-->
<script src="index.js" defer></script>

</html>
