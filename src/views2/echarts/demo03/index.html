<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>antd示例</title>
  <!-- 导入 ICON -->
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <!-- 导入 AntDesignVue -->
  <link rel="stylesheet" href="/public/ant-design-vue/antd.reset.css">
  <link rel="stylesheet" href="/public/ant-design-vue/antd.min.css">
  <!-- 导入 Layui-->
  <link rel="stylesheet" href="/public/layui/css/layui.css">
  <!-- 导入 自定义CSS -->
  <link rel="stylesheet" href="index.css" />
  <!-- 其他头部信息 -->
  <style>

  </style>
</head>

<body>
  <div id="app">
    <a-config-provider :locale="antdAppLocale">
      <a-spin :spinning="loading" tip="加载中...">
        <div class="root-container">
          <!-- 布局 1: 筛选区域-->
          <div class="layout-search">
            <a-config-provider :locale="locale">
              <a-form ref="searchFormRef" :model="searchForm" :rules="rules" layout="inline" class="search-form-inline">
                <!-- 条件容器 -->
                <div class="search-filters-flex">
                  <a-form-item-rest>
                    <a-form-item label="商品分类" name="plNos">
                      <a-tree-select v-model:value="searchForm.plNos" style="width: 180px" :tree-data="treeData"
                        tree-checkable allow-clear placeholder="默认全部商品分类" :field-names="treeProps"
                        :treeDefaultExpandedKeys="expandedKeys" class="search-tree-select" />
                    </a-form-item>
                  </a-form-item-rest>

                  <a-form-item label="商品编号" name="equipmentNo">
                    <a-input v-model:value="searchForm.equipmentNo" placeholder="请输入商品编号" allow-clear
                      class="search-input" />
                  </a-form-item>
                  <a-form-item label="商品售后模式" name="stopReasonName">
                    <a-select v-model:value="searchForm.stopReasonName" mode="multiple" placeholder="请选择退货原因"
                      :options="attrCnts.faultModeOptions" allow-clear class="search-select" />
                  </a-form-item>
                  <a-form-item label="日期范围" name="vDay">
                    <a-range-picker v-model:value="searchForm.vDay" :placeholder="['开始日期', '结束日期']" format="YYYY/MM/DD"
                      valueFormat="YYYY/MM/DD" class="search-datepicker" />
                  </a-form-item>
                  <div class="search-buttons">
                    <a-form-item>
                      <a-button type="primary" @click="fun_search()">查询</a-button>
                      <a-button style="margin-left: 8px" @click="fun_reset()">重置</a-button>
                    </a-form-item>
                  </div>
                </div>
              </a-form>
            </a-config-provider>
          </div>

          <!-- 布局 2: 内容区域-->
          <div class="layout-content">
            <div class="content-area">
              <a-row :gutter="16">
                <!-- 左侧列表 -->
                <a-col :span="6">
                  <a-card :bordered="false" class="list-card" size="small">
                    <template #title>
                      <span>退货原因列表</span>
                    </template>
                    <a-table :columns="tableColumns" :data-source="dataList" :pagination="false" :scroll="{ y: 475 }"
                      size="small" row-key="bkReasonName">
                      <template #bodyCell="{ column, text }">
                        <template v-if="column.key === 'bkReasonName'">
                          <a-tooltip :title="text">
                            <span class="table-cell-tooltip">{{ text }}</span>
                          </a-tooltip>
                        </template>
                      </template>
                    </a-table>
                  </a-card>
                </a-col>
                <!-- 右侧图表 -->
                <a-col :span="18">
                  <a-card :bordered="false" class="chart-card" size="small">
                    <template #title>
                      <span>退货原因分布图（%）</span>
                    </template>
                    <div ref="chartRef" class="chart-container"></div>
                  </a-card>
                </a-col>
              </a-row>
            </div>
          </div>

          <!-- 布局 3: 分析功能区域-->
          <div class="layout-analysis">
            <a-card :bordered="false" class="analysis-card" size="small">
              <template #title>
                <span>分析功能</span>
              </template>
              <div>
                <a-textarea v-model:value="analysisText" :rows="2" readonly :autoSize="false"
                  class="analysis-textarea" />
              </div>
            </a-card>
          </div>
        </div>
      </a-spin>
    </a-config-provider>
  </div>
</body>
<!-- 导入 Vue3 -->
<script src="/public/vue/vue.global.prod.js"></script>
<!-- 导入 Dayjs (Antd 推荐配合使用) -->
<script src="/public/dayjs/dayjs.min.js"></script>
<script src="/public/dayjs/locale/zh-cn.js"></script>
<script src="/public/dayjs/plugin/isBetween.js"></script>
<script src="/public/dayjs/plugin/isSameOrBefore.js"></script>
<script src="/public/dayjs/plugin/customParseFormat.js"></script>
<script src="/public/dayjs/plugin/advancedFormat.js"></script>
<script src="/public/dayjs/plugin/weekday.js"></script>
<script src="/public/dayjs/plugin/localeData.js"></script>
<script src="/public/dayjs/plugin/weekOfYear.js"></script>
<script src="/public/dayjs/plugin/weekYear.js"></script>
<script src="/public/dayjs/plugin/quarterOfYear.js"></script>
<!-- 导入 AntDesignVue，包含中文语言包，使用 a-config-provider :locale="antdAppLocale"-->
<script src="/public/ant-design-vue/antd-with-locales.min.js"></script>
<!-- 导入 Axios -->
<script src="/public/axios/axios.min.js"></script>
<!-- 导入 Echarts -->
<script src="/public/echarts/echarts.js"></script>
<!-- 导入 Jquery-->
<script src="/public/jquery/jquery.min.js"></script>
<!-- 导入 index.js-->
<script src="index.js" defer></script>

</html>
