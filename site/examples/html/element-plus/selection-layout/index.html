<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="example-id" content="element-plus/selection-layout"><title>Element Plus · 容器布局与选择 · Libra Boot Vue</title><link rel="stylesheet" href="../../../../shared/styles/global.css"></head><body><header class="site-header"><div class="preview-header"><h1>Element Plus · 容器布局与选择</h1><a href="../../../../index.html">返回示例目录</a></div><p class="note">仅使用电商模拟数据；刷新恢复初始状态，不访问业务服务。</p><p id="page-status" role="status">正在加载本地依赖…</p></header><main class="page"><div id="app" class="panel" v-cloak><section class="demo-shell"><search><form class="toolbar" action="" method="get" @submit.prevent="search"><label for="filter-query">商品名称或 SKU<input id="filter-query" name="q" type="search" v-model="query" maxlength="100"></label><label for="filter-category">品类<select id="filter-category" name="category" v-model="category"><option value="">全部</option><option>数码配件</option><option>家居用品</option><option>办公文具</option></select></label><el-button native-type="submit"  @click="">查询</el-button><el-button native-type="button"  @click="reset">重置</el-button></form></search><div class="actions"><el-button native-type="button" id="create-record" @click="create">新增商品</el-button></div><form action="" method="post" @submit.prevent="save" v-if="editing" class="native-form"><fieldset class="edit-form"><legend>编辑商品</legend><label for="record-name">商品名称（必填）<input id="record-name" name="name" v-model="editing.name" required maxlength="60" pattern=".*\S.*"></label><label for="record-category">品类<select id="record-category" name="category" v-model="editing.category"><option>数码配件</option><option>家居用品</option><option>办公文具</option></select></label><label for="record-status">上架状态<select id="record-status" name="status" v-model="editing.status"><option>在售</option><option>下架</option></select></label><label for="record-stock">库存（件，必填）<input id="record-stock" name="stock" type="number" v-model.number="editing.stock" min="0" max="999999" step="1" required></label><div class="actions"><button type="submit" class="primary">保存商品</button><button type="button" @click="cancelEdit">取消编辑</button></div></fieldset></form><p role="status" class="summary">{{notice}}</p><div class="split"><section><div class="table-scroll" tabindex="0" role="region" aria-label="演示数据，可横向滚动"><el-table :data="visibleRows" row-key="id" @row-click="choose" aria-label="演示数据表"><el-table-column prop="code" label="SKU" width="140"></el-table-column><el-table-column prop="name" label="商品名称" min-width="150"></el-table-column><el-table-column prop="category" label="品类" width="110"></el-table-column><el-table-column prop="stock" label="库存（件）" width="110"></el-table-column><el-table-column prop="status" label="上架状态" width="100"></el-table-column><el-table-column label="操作" min-width="240"><template #default="{row}"><div class="actions"><button type="button" @click.stop="choose(row)" :aria-label="'选择 '+row.code">选择</button><button type="button" @click.stop="edit(row)" :aria-label="'编辑 '+row.code">编辑</button><button type="button" @click.stop="remove(row)" :aria-label="'删除 '+row.code">删除</button></div></template></el-table-column></el-table></div><nav class="pagination" aria-label="演示数据分页"><button type="button" :disabled="page===1" @click="previous">上一页</button><span>第 {{page}} / {{pageCount}} 页 · {{filtered.length}} 件商品</span><button type="button" :disabled="page===pageCount" @click="next">下一页</button></nav></section><aside class="panel"><h2>当前商品</h2><p v-if="selected">{{selected.code}} · {{selected.name}}</p><p v-else>点击行或“选择”查看商品。</p><p class="note">数据为人工构造，操作只影响当前页面。</p></aside></div></section></div></main><script type="module" src="./index.js"></script></body></html>
